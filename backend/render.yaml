services:
  - type: web
    name: skill-swap-api
    runtime: node
    plan: standard
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: skill-swap-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://skill-swap.vercel.app

databases:
  - name: skill-swap-db
    plan: standard
    region: oregon
    databaseName: skillswap
    user: skillswap_user
